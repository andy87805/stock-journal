<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>StockJournal</title>
    <meta name="theme-color" content="#161b22" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="StockJournal" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="auth-gate" id="authGate">
      <div class="auth-card">
        <div class="brand">
          <!-- K 線標誌，跟主畫面圖示同一個造型 -->
          <svg height="48" viewBox="0 0 16 16" width="48" aria-hidden="true">
            <g fill="#3fb950">
              <rect x="5.26" y="7.68" width="0.35" height="4.48" rx="0.17"></rect>
              <rect x="4.84" y="8.64" width="1.2" height="2.56" rx="0.3"></rect>
            </g>
            <g fill="#f85149">
              <rect x="7.82" y="5.44" width="0.35" height="5.12" rx="0.17"></rect>
              <rect x="7.4" y="6.4" width="1.2" height="3.2" rx="0.3"></rect>
              <rect x="10.38" y="3.52" width="0.35" height="4.8" rx="0.17"></rect>
              <rect x="9.96" y="4.48" width="1.2" height="2.88" rx="0.3"></rect>
            </g>
            <g fill="none" stroke="#2f81f7" stroke-width="0.56" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3.84 10.88 L6.4 8.96 L8.96 7.04 L12.16 4.16"></path>
            </g>
            <g fill="#2f81f7">
              <circle cx="3.84" cy="10.88" r="0.48"></circle>
              <circle cx="12.16" cy="4.16" r="0.48"></circle>
            </g>
          </svg>
          <div>StockJournal</div>
        </div>
        <div class="box">
          <div class="box-body">
            <div class="auth-error hidden" id="authError"></div>
            <form id="authForm">
              <div class="field">
                <label for="authEmail">Email</label>
                <input
                  type="email"
                  id="authEmail"
                  autocomplete="username"
                  required
                />
              </div>
              <div class="field">
                <label for="authPassword">密碼</label>
                <input
                  type="password"
                  id="authPassword"
                  autocomplete="current-password"
                  required
                />
              </div>
              <button
                type="submit"
                class="btn btn-primary"
                id="authSubmit"
                style="width: 100%"
              >
                登入
              </button>
            </form>
            <button
              type="button"
              class="btn"
              id="authModeBtn"
              style="width: 100%; margin-top: 8px"
            >
              第一次使用？註冊帳號
            </button>
            <div class="row-sub" id="authModeHint" style="margin-top: 8px"></div>
          </div>
        </div>
        <div class="blankslate" style="padding: 12px; font-size: 12px">
          每個帳號的交易資料各自獨立，彼此看不到對方的紀錄
        </div>
      </div>
    </div>

    <!-- 註冊開放，任何人都能建帳號，但 Email 沒被列進開通名單就讀寫不到任何資料 -->
    <div class="auth-gate hidden" id="authPending">
      <div class="auth-card">
        <div class="box">
          <div class="box-header">尚未開通</div>
          <div class="box-body">
            <div class="row-sub">
              <span id="authPendingEmail" class="mono"></span>
              這個帳號已經建立好了，但還沒有被加入開通名單，所以讀不到任何資料。
            </div>
            <div class="row-sub" style="margin-top: 8px">
              請這個 App 的擁有者到「設定」頁把你的 Email 加進名單，加完重新登入即可。
            </div>
            <button
              type="button"
              class="btn"
              id="authPendingSignOut"
              style="width: 100%; margin-top: 12px"
            >
              登出
            </button>
          </div>
        </div>
      </div>
    </div>

    <header class="app-header hidden" id="appHeader">
      <svg class="logo" height="22" viewBox="0 0 16 16" width="22" aria-hidden="true">
        <g fill="#3fb950">
          <rect x="5.26" y="7.68" width="0.35" height="4.48" rx="0.17"></rect>
          <rect x="4.84" y="8.64" width="1.2" height="2.56" rx="0.3"></rect>
        </g>
        <g fill="#f85149">
          <rect x="7.82" y="5.44" width="0.35" height="5.12" rx="0.17"></rect>
          <rect x="7.4" y="6.4" width="1.2" height="3.2" rx="0.3"></rect>
          <rect x="10.38" y="3.52" width="0.35" height="4.8" rx="0.17"></rect>
          <rect x="9.96" y="4.48" width="1.2" height="2.88" rx="0.3"></rect>
        </g>
        <g fill="none" stroke="#2f81f7" stroke-width="0.56" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.84 10.88 L6.4 8.96 L8.96 7.04 L12.16 4.16"></path>
        </g>
        <g fill="#2f81f7">
          <circle cx="3.84" cy="10.88" r="0.48"></circle>
          <circle cx="12.16" cy="4.16" r="0.48"></circle>
        </g>
      </svg>
      <div class="title">stock<span>-journal</span></div>
      <span class="sync-badge" id="syncBadge">—</span>
      <button class="icon-btn" id="themeBtn" title="切換佈景">◐</button>
      <button class="icon-btn" id="signOutBtn" title="登出">⏻</button>
    </header>

    <nav class="tabnav hidden" id="tabnav">
      <a href="#/" data-route="/">總覽</a>
      <a href="#/positions" data-route="/positions">持股</a>
      <a href="#/ledger" data-route="/ledger">交易紀錄</a>
      <a href="#/realized" data-route="/realized">已實現</a>
      <a href="#/options" data-route="/options">選擇權</a>
      <a href="#/chart" data-route="/chart">損益走勢</a>
      <a href="#/exposure" data-route="/exposure">曝險</a>
      <a href="#/stats" data-route="/stats">統計</a>
      <a href="#/dividends" data-route="/dividends">股利</a>
      <a href="#/reminders" data-route="/reminders">提醒</a>
      <a href="#/report" data-route="/report">報表</a>
      <a href="#/settings" data-route="/settings" class="hidden">設定</a>
    </nav>

    <main id="view" class="hidden"></main>

    <script type="module" src="app.js"></script>
  </body>
</html>
