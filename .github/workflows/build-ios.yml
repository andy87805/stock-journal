# NOTE: macos-latest runner 只有在 repo 是 public 的情況下才有免費無限額度；
# private repo 的 macOS runner 分鐘數會計費（而且比 Linux runner 貴很多倍）。
# 這也是 SETUP.md 要求把這個 repo 建成 public 的原因。
name: Build & Publish iOS OTA Install

on:
  schedule:
    # 每週日 04:00 UTC
    - cron: "0 4 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write # 需要 push 到 gh-pages branch

env:
  PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/stock-journal

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write GoogleService-Info.plist
        run: |
          mkdir -p ios/Sources
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" | base64 -d > ios/Sources/GoogleService-Info.plist

      - name: Generate Xcode project
        run: cd ios && xcodegen generate

      - name: Install fastlane
        run: gem install fastlane

      - name: Build & sign (fastlane)
        env:
          FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          DEVICE_UDID: ${{ secrets.DEVICE_UDID }}
        run: cd ios-build && fastlane ios build_and_publish

      - name: Generate OTA manifest.plist + index.html
        env:
          PAGES_BASE_URL: ${{ env.PAGES_BASE_URL }}
        run: python3 ios-build/make_manifest.py

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ios-build/publish
          keep_files: false

      - name: Send install link email
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          PAGES_BASE_URL: ${{ env.PAGES_BASE_URL }}
        run: python3 ios-build/send_install_email.py
