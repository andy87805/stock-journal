name: Sync Trading Data

on:
  schedule:
    # 05:35 UTC = 13:35 台灣時間，台股收盤後（週一到週五）
    - cron: "35 5 * * 1-5"
    # 21:30 UTC ≈ 16:30-17:30 美東時間（美股收盤後），美國有夏令時間切換
    # 這個 cron 是固定 UTC 時間，夏令/冬令會差一小時，個人用途可接受，不精修
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
    inputs:
      send_reminders:
        description: "本次手動同步是否寄送提醒信"
        type: boolean
        default: false

# 兩段式：
#   brokers  每個使用者各跑一次，抓自己的券商資料寫進 users/{uid}/
#   shared   跑一次就好，抓所有人都要用的市場資料（現價/名稱/匯率/行事曆）
# 分開的原因：市場資料是共用的，每個使用者重複抓一次只是白白多打 API。
permissions:
  contents: read

concurrency:
  group: trading-data-sync
  cancel-in-progress: false

jobs:
  brokers:
    runs-on: ubuntu-latest
    strategy:
      # 一個人的券商掛掉不該讓另一個人的同步也停掉
      fail-fast: false
      matrix:
        include:
          - name: owner
            uid_secret: SYNC_UID_OWNER
            shioaji_key_secret: SHIOAJI_API_KEY
            shioaji_secret_secret: SHIOAJI_API_SECRET
            recipient_secret: RECIPIENT_EMAIL
            schwab_id_secret: SCHWAB_CLIENT_ID
            schwab_secret_secret: SCHWAB_CLIENT_SECRET
            schwab_token_secret: SCHWAB_REFRESH_TOKEN
          # 第二個使用者。對應的 secret 沒設定的話整個 matrix 項目會自己跳過，
          # 不會每次執行都固定失敗（久了就會習慣性忽略失敗通知）。
          - name: partner
            uid_secret: SYNC_UID_PARTNER
            shioaji_key_secret: SHIOAJI_API_KEY_PARTNER
            shioaji_secret_secret: SHIOAJI_API_SECRET_PARTNER
            recipient_secret: RECIPIENT_EMAIL_PARTNER
            schwab_id_secret: SCHWAB_CLIENT_ID_PARTNER
            schwab_secret_secret: SCHWAB_CLIENT_SECRET_PARTNER
            schwab_token_secret: SCHWAB_REFRESH_TOKEN_PARTNER
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      # 決定這一輪要把資料寫進誰的 users/{uid} 底下。沒設定時同步腳本會直接失敗，
      # 而不是預設成某個人——預設值會把 A 的券商資料靜靜寫進 B 的帳號。
      SYNC_USER_UID: ${{ secrets[matrix.uid_secret] }}
      SHIOAJI_API_KEY: ${{ secrets[matrix.shioaji_key_secret] }}
      SHIOAJI_API_SECRET: ${{ secrets[matrix.shioaji_secret_secret] }}
      SCHWAB_CLIENT_ID: ${{ secrets[matrix.schwab_id_secret] }}
      SCHWAB_CLIENT_SECRET: ${{ secrets[matrix.schwab_secret_secret] }}
      SCHWAB_REFRESH_TOKEN: ${{ secrets[matrix.schwab_token_secret] }}
      SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      RECIPIENT_EMAIL: ${{ secrets[matrix.recipient_secret] }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r sync/requirements.txt

      # 這個使用者還沒設定 UID，代表他不存在（或還沒接券商），整個 job 就不用跑
      - name: Check whether this user is configured
        id: gate
        run: |
          if [ -z "$SYNC_USER_UID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.name }} 沒有設定 ${{ matrix.uid_secret }}，跳過"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # 每支腳本各自 continue-on-error，避免其中一個掛掉擋住其他的
      - name: Sync Shioaji (台股)
        id: shioaji
        if: steps.gate.outputs.configured == 'true' && env.SHIOAJI_API_KEY != ''
        continue-on-error: true
        run: python sync/shioaji_sync.py

      # Schwab 暫緩中（開發者平台 2FA 只收美國門號），沒設 secret 就整步跳過，
      # 否則每次執行都會固定失敗，久了就會習慣性忽略失敗通知
      - name: Sync Schwab (美股)
        id: schwab
        if: steps.gate.outputs.configured == 'true' && env.SCHWAB_CLIENT_ID != ''
        continue-on-error: true
        run: python sync/schwab_sync.py

      # 前面幾步都設了 continue-on-error，job 本身不會因此變紅
      # 這一步手動檢查有沒有任一步失敗，有的話讓 job 失敗
      # 好處：GitHub 內建的失敗通知信才會正常觸發
      - name: Check for failures
        if: always()
        run: |
          if [ "${{ steps.shioaji.outcome }}" = "failure" ] || \
             [ "${{ steps.schwab.outcome }}" = "failure" ]; then
            echo "${{ matrix.name }} 至少一支同步腳本失敗，詳見上方對應步驟的 log"
            exit 1
          fi

  shared:
    runs-on: ubuntu-latest
    # 券商同步先跑完，這樣新買的股票在同一輪就能抓到現價與名稱
    needs: brokers
    # 就算某個人的券商同步失敗，共用的行情資料還是該更新
    if: always()
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r sync/requirements.txt

      - name: Sync Calendar (除權息/財報日)
        id: calendar
        continue-on-error: true
        run: python sync/calendar_sync.py

      # 台股現價由永豐同步帶出來，美股沒有券商 API 可用，另外抓
      - name: Sync Quotes (美股現價)
        id: quotes
        continue-on-error: true
        run: python sync/quotes_sync.py

      # 介面要顯示「台積電 2330」而不只是代號，名稱從 TWSE 開放資料抓
      - name: Sync Symbols (代號名稱)
        id: symbols
        continue-on-error: true
        run: python sync/symbols_sync.py --only-held

      # 總覽要把美股換算成台幣加總，匯率在這裡抓（前端直連有 CORS 與離線問題）
      - name: Sync FX (匯率)
        id: fx
        continue-on-error: true
        run: python sync/fx_sync.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Save daily asset snapshot
        id: snapshot
        continue-on-error: true
        run: python sync/snapshot_sync.py

      - name: Check for failures
        if: always()
        run: |
          if [ "${{ steps.calendar.outcome }}" = "failure" ] || \
             [ "${{ steps.quotes.outcome }}" = "failure" ] || \
             [ "${{ steps.symbols.outcome }}" = "failure" ] || \
             [ "${{ steps.fx.outcome }}" = "failure" ] || \
             [ "${{ steps.snapshot.outcome }}" = "failure" ]; then
            echo "至少一支共用資料同步腳本失敗，詳見上方對應步驟的 log"
            exit 1
          fi

  reminders:
    runs-on: ubuntu-latest
    needs: shared
    if: always() && needs.shared.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - uid_secret: SYNC_UID_OWNER
            recipient_secret: RECIPIENT_EMAIL
          - uid_secret: SYNC_UID_PARTNER
            recipient_secret: RECIPIENT_EMAIL_PARTNER
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      SYNC_USER_UID: ${{ secrets[matrix.uid_secret] }}
      RECIPIENT_EMAIL: ${{ secrets[matrix.recipient_secret] }}
      SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r sync/requirements.txt
      - name: Send reminders after calendar update
        if: >-
          env.SYNC_USER_UID != '' && env.RECIPIENT_EMAIL != '' &&
          env.SENDER_EMAIL != '' && env.GMAIL_APP_PASSWORD != '' &&
          ((github.event_name == 'workflow_dispatch' && inputs.send_reminders) || github.event.schedule == '35 5 * * 1-5')
        run: python sync/send_reminders.py
